network:
  net_file: sumo/net/dummy/single-intersection.net.xml
  route_files: []
  additional_files: []
traffic_light:
  ts_id: "t"
  single_agent: true
  # SUMO tlLogic programID to activate.
  # null → use the first program SUMO loads (default sumo-rl behaviour).
  # Set to a specific string (e.g. "rl") to select a named program defined
  # in the net file or additional file without editing the XML.
  program_id: null
timing:
  num_seconds: 900
  delta_time: 5
  min_green: 30
  max_green: 60
  yellow_time: 3
sumo_options:
  use_gui: false
  lateral_resolution: 1.2
  additional_sumo_cmd: ""
  save_tripinfo: false
observation_bounds:
  max_queue_per_lane: 100.0
  max_time_in_phase: 900.0