experiment:
  name: roundabout_ppo_main
  seed: 42
  device: auto
  split_allowed: TR

environment:
  env_config_path: configs/environment/roundabout.yaml
  manifest_path: scenarios/json_definitions/selected_scenario.csv

reward:
  # Using custom CombinedReward with delay, queue, flicker penalty, and deadlock suppression
  type: combined
  params:
    wait_weight: 1.5
    queue_weight: 2.0
    flicker_weight: 1.0
    lambda_f: 0.99
    delta_time: 5
    v_stall: 0.1
    t_stall_limit: 120.0
    deadlock_penalty: 5.0
    max_wait_time: 60.0
  wrappers: {}

normalization:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99

model_hyperparameters:
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  verbose: 1

training_control:
  total_timesteps: 100000
  save_freq: 1440
  eval_freq: 0
  log_csv: true
