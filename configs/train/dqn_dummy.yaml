experiment:
  name: dummy_dqn
  seed: 5
  device: cuda
  split_allowed: TR

environment:
  env_config_path: configs/environment/dev_single_intersection.yaml
  manifest_path: scenarios/pilot_scenario_manifest.csv

reward:
  # Changed from 'combined' to 'pressure' for the dummy network.
  type: pressure
  params: {}
  wrappers: {}

normalization:
  norm_obs: true
  norm_reward: true
  clip_obs: 1.0
  clip_reward: 10.0

model_hyperparameters:
  policy: MlpPolicy
  learning_rate: 0.0003
  batch_size: 512
  buffer_size: 1000000
  learning_starts: 1000
  gamma: 0.99
  n_steps: 5
  exploration_fraction: 0.5
  tau: 0.01
  target_update_interval: 2
  verbose: 1

training_control:
  total_timesteps: 10000
  save_freq: 1000
  eval_freq: 0
  log_csv: true
